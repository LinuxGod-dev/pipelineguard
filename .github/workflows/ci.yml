   name: ci
   on: [push, pull_request]
   permissions:
     contents: read
   jobs:
     test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # pin with: remediate pin .github/workflows
         - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 # pin with: remediate pin .github/workflows
           with: {python-version: "3.12"}
         - run: pip install -r requirements-dev.txt
         - run: python -m pytest -q
         - run: python -m pipelineguard scan-workflows .github/workflows --fail-on medium